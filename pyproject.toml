[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobaxterm-zh"
version = "1.0.0"
description = "Patch a stock MobaXterm Windows build into a Simplified Chinese one, by rewriting its Delphi DFM resources and runtime string table in place."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["mobaxterm", "localization", "i18n", "delphi", "dfm", "chinese"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Localization",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
# Enables dragging a file onto the window. Optional on purpose: without it the
# GUI still works, you just have to use the Browse button.
gui = ["tkinterdnd2>=0.4"]

[project.scripts]
mobaxterm-zh = "mobaxterm_zh.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mobaxterm_zh = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
